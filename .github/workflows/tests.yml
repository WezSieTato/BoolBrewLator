name: Unit Tests

on:
  push:
    branches: ['master']
  pull_request:
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '12.x'
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    - run: flutter pub get
    - run: flutter analyze
    - run: flutter test
    - name: Archive golden image diffs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: golden-image-diffs
        path: test/**/failures
