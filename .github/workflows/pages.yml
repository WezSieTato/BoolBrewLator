name: Deploy To Github Pages

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
      - run: dart run slang
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /BoolBrewLator/
